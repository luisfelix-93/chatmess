version: '3.8'

services: 
  nginx_load_balancer:
    image: nginx:latest
    ports:
      - "50:80"
    deploy:
      replicas: 1 # Nginx é stateless, não é possível e nem necessário ter mais de um container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro #  Mapeia a configuração do Nginx
    networks:
      - custom_network
    depends_on:
      - chatmess-api
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    deploy:
      replicas: 1 # MongoDB é stateful, não é possível ter mais de um container
      placement:
        constraints:
          - node.role == manager # O container do MongoDB deve rodar em um nó manager
      resources:
        limits:
          cpus: '1' # Limite de CPU para o MongoDB
          memory: 1GB # Limite de memória para o MongoDB
    logging:
      driver: "json-file" # Driver de log para o containe
        
      options:
        max-size: "10M" # Tamanho máximo do arquivo de log
        max-file: "3" # Número máximo de arquivos de log
    volumes:
      - mongo_data:/data/db # Volume para persistir os dados do MongoDB
      - mongo_logs:/var/log/mongodb # Volume para persistir os logs do MongoDB
    command: "--logpath /var/log/mongodb/mongodb.log" # Argumento para o comando do MongoDB
    networks:
      - custom_network
  
  redis: 
    image: redis:latest
    ports:
      - "6379:6379"
    deploy:
      replicas: 1 # Redis é stateful, não é possível ter mais de um container
    volumes: 
      - redis_data:/data # Volume para persistir os dados do Redis
    networks:
      - custom_network 
  
  chatmess-api:
    image: luisffilho/chatmessapi:latest
    ports:
      - "8080:8080"
    deploy:
      replicas: 2 # Escale horizontalmente a API
      update_config:
        parallelism: 1
        delay: 10s
      # resources:
      #   limits:
      #     cpus: '0.5' # Limite de CPU para cada instância da API
      #     memory: 512M # Limite de memória para cada instância da API
    environment:
      - DATABASEHELPER__CONNECTIONSTRING=mongodb://mongo:27017  # Use o nome do serviço para se conectar ao MongoDB
      - DATABASEHELPER__DATABASENAME=chatmess-db
      - DATABASEHELPER__MESSAGECOLLECTION=message
      - DATABASEHELPER__USERCOLLECTION=user
      - DATABASEHELPER__ROOMCOLLECTION=room
      - LOGGERHELPER__URILOGSERVER=http://loki:3100
      - LOGGERHELPER__ENVIROMENT=Production
    depends_on:
      - mongo
      - loki
    networks:
      - custom_network
    
  chatmess-ws:
    image: luisffilho/chatmessws:latest
    ports:
      - "3001:3001"
    deploy:
      replicas: 1
      restart_policy:  # Exemplo correto se necessário
        condition: on-failure
    environment:
      - URL_MESSAGE=http://chatmess-api:8080/Message
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - URI_LOGGER=http://loki:3100
      - ENVIROMENT=Production
    networks:
      - custom_network

  loki:
    image: grafana/loki:latest
    ports:
      - 3100:3100
    volumes:
      - loki-data:/loki/chunks
    networks:
      - custom_network

  grafana:
    image: grafana/grafana:latest
    ports: 
      - 4190:4190
    volumes:
     - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - custom_network

  promtail:
    image: grafana/promtail:latest
    volumes: 
      - ./promtail-config.yaml:/etc/promtail
      - /var/log:/var/log
    command: -config.file:/etc/promtail/config.yaml

networks:
  custom_network:
    driver: overlay # Rede overlay para comunicação entre os serviços

volumes:
  mongo_data:
  mongo_logs:
  redis_data:
  loki-data:
  grafana-data:
